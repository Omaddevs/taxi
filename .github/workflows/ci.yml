name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w server

      - name: Typecheck server
        run: npx tsc -p server/tsconfig.json --noEmit

      - name: Lint server
        run: npm run lint:server

      - name: Lint web
        run: npm run lint:web

      - name: Lint admin
        run: npm run lint:admin

      - name: Build server
        run: npm run build:server

      - name: Build web
        run: npm run build:web

      - name: Build admin
        run: npm run build:admin

      - name: Test server
        run: npm run test:server

      - name: Test web
        run: npm run test:web

      - name: Test admin
        run: npm run test:admin

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t taxiline-server .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t taxiline-web .

      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t taxiline-admin .
