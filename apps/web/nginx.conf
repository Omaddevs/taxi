server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bosh sahifa — build'dagi '/' varianti (to‘g‘ri title, canonical, JSON-LD).
  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  # SPA routing. Public SEO pages are prerendered by seo-plugin.js as <route>.html
  # (/aksiyalar -> aksiyalar.html, each with its own title/canonical/OG). Everything else
  # (private screens, /news/<slug>) falls back to app.html — the same app shell without a
  # canonical tag, so Google never sees a wrong canonical before JS sets the real one.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html /app.html;
  }

  # Vite fingerprints everything under /assets — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # public/ files keep their names (cargo images, icons) — cache briefly so replacements show up.
  location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # index.html must never be cached, or users keep loading old bundles after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Prerendered pages and app.html are HTML too — same rule, or old bundles stick after a deploy.
  location ~ \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
