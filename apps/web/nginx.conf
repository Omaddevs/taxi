server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing — react-router-dom owns the client-side paths, so any unmatched
  # request falls back to index.html instead of a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints everything under /assets — safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # public/ files keep their names (cargo images, icons) — cache briefly so replacements show up.
  location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # index.html must never be cached, or users keep loading old bundles after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
