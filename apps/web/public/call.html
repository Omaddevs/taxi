<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#00c7d4">
  <title>Qo'ng'iroq — TaxiLine</title>
  <link rel="icon" href="/favicon-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Target of the «📞 Tel qilish» buttons on the bot's group ad cards. Telegram buttons can't
       hold tel: links, so they open this page with a signed ad reference (k, i, s) — plus, for
       login_url buttons, the tapper's Telegram login data. The page posts both to the API, which
       logs the call (admin → Bot sozlamalari → Aloqa) and returns the number to dial. -->
  <style>
    :root {
      --brand: #00c7d4; --brand-dark: #00a3ae; --brand-soft: #e0f9fb;
      --ink: #1a2b3c; --muted: #6b7a8c; --line: #e6eaf0; --canvas: #f4f6f9; --card: #ffffff;
      --ok: #16a34a; --ok-dark: #12833d; --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #eef0f4; --muted: #9aa6b5; --line: #263241; --canvas: #0f1720; --card: #17212b; --brand-soft: #0c3a40; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased;
    }
    header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); }
    header img { width: 34px; height: 34px; border-radius: 10px; }
    header b { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
    header b span { color: var(--brand); }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 16px 24px; }
    .card {
      width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line);
      border-radius: 24px; padding: 28px 22px 22px; text-align: center;
      box-shadow: 0 12px 40px rgba(26, 43, 60, 0.08);
    }
    .avatar {
      width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%;
      display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-dark);
      font-size: 30px; font-weight: 800; position: relative;
    }
    .avatar::after {
      content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--brand);
      opacity: 0; animation: ring 1.8s ease-out infinite;
    }
    .calling .avatar::after { opacity: 1; }
    @keyframes ring { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
    .role {
      display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: var(--brand-soft); color: var(--brand-dark); margin-bottom: 8px;
    }
    .name { font-size: 18px; font-weight: 700; margin: 0; }
    .group { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
    .phone { font-size: 30px; font-weight: 800; letter-spacing: 0.01em; margin: 18px 0 4px; font-variant-numeric: tabular-nums; }
    .hint { font-size: 13px; color: var(--muted); margin: 0 0 20px; min-height: 18px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 54px;
      border-radius: 16px; border: 0; font: inherit; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 20px; height: 20px; }
    .btn-call { background: var(--ok); color: #fff; box-shadow: 0 8px 20px rgba(22, 163, 74, 0.28); }
    .btn-call:hover { background: var(--ok-dark); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-soft { height: 46px; font-size: 14px; background: var(--canvas); color: var(--ink); border: 1px solid var(--line); }
    .skeleton { display: inline-block; height: 1em; width: 60%; border-radius: 8px; background: var(--line); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .error { color: var(--danger); font-weight: 600; }
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
    footer a { color: var(--brand-dark); text-decoration: none; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="/logo.png" alt="">
    <b>Taxi<span>Line</span></b>
  </header>
  <main>
    <div class="card" id="card">
      <div class="avatar" id="avatar">📞</div>
      <div><span class="role" id="role" hidden></span></div>
      <p class="name" id="name"><span class="skeleton"></span></p>
      <p class="group" id="group"></p>
      <p class="phone" id="phone"><span class="skeleton" style="width: 80%"></span></p>
      <p class="hint" id="hint">Raqam yuklanmoqda…</p>
      <a class="btn btn-call" id="call" href="#" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>
        Qo'ng'iroq qilish
      </a>
      <div class="row" id="extra" hidden>
        <button class="btn btn-soft" id="copy" type="button">Nusxalash</button>
        <button class="btn btn-soft" id="back" type="button">Orqaga</button>
      </div>
    </div>
  </main>
  <footer><a href="/">taxiline.uz</a> — shaharlararo taksi xizmati</footer>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);
      var host = location.hostname.replace(/^www\./, '');
      var api = /^(localhost|127\.)/.test(host) ? 'http://localhost:4000' : 'https://api.' + host;

      function initials(name) {
        var parts = (name || '').trim().split(/\s+/).filter(Boolean);
        return parts.length ? (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase() : '📞';
      }

      function fail(message) {
        $('name').textContent = 'Raqamni ochib bo‘lmadi';
        $('phone').textContent = '';
        $('hint').innerHTML = '<span class="error"></span>';
        $('hint').firstChild.textContent = message;
        $('extra').hidden = false;
        $('copy').hidden = true;
      }

      function show(data) {
        var digits = String(data.phone || '').replace(/\D/g, '');
        if (!/^998\d{9}$/.test(digits)) return fail('Raqam noto‘g‘ri');
        var tel = 'tel:+' + digits;
        var display = data.phoneDisplay || '+' + digits;
        $('avatar').textContent = initials(data.ownerName);
        $('name').textContent = data.ownerName || 'E’lon egasi';
        $('group').textContent = data.chatTitle || '';
        if (data.role) {
          $('role').textContent = data.role === 'PASSENGER' ? '🙋 Yo‘lovchi' : '🚕 Haydovchi';
          $('role').hidden = false;
        }
        $('phone').textContent = display;
        $('hint').textContent = 'Qo‘ng‘iroq oynasi ochilmasa, tugmani bosing';
        $('call').href = tel;
        $('call').hidden = false;
        $('extra').hidden = false;
        $('copy').onclick = function () {
          var done = function () { $('copy').textContent = 'Nusxalandi ✓'; };
          if (navigator.clipboard) navigator.clipboard.writeText('+' + digits).then(done, done);
          else done();
        };
        $('card').classList.add('calling');
        // The Telegram login fields shouldn't linger in a URL someone might share.
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        location.href = tel;
      }

      $('back').onclick = function () {
        if (history.length > 1) history.back();
        else window.close();
      };

      // Old cards (before call logging) carry the number itself: ?n=+998…
      if (params.get('n')) return show({ phone: params.get('n') });

      var k = params.get('k'), i = params.get('i'), s = params.get('s');
      if (!k || !i || !s) return fail('Havola to‘liq emas');

      var tg = null;
      if (params.get('hash') && params.get('id')) {
        tg = {};
        params.forEach(function (value, key) { if (key !== 'k' && key !== 'i' && key !== 's') tg[key] = value; });
      }

      fetch(api + '/calls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ k: k, i: Number(i), s: s, tg: tg }),
      })
        .then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok) throw new Error((body && body.error && (body.error.message || body.error)) || 'E’lon topilmadi');
            return body;
          });
        })
        .then(show)
        .catch(function (err) { fail(err && err.message ? err.message : 'Internet aloqasini tekshiring'); });
    })();
  </script>
</body>
</html>
