<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Qo'ng'iroq — TaxiLine</title>
  <!-- Target of the "Tel qilish" button on the bot's group ad cards: Telegram inline buttons
       can't hold tel: links, so they open this page, which hands the number to the dialer. -->
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #17212b; color: #fff; }
    .box { text-align: center; padding: 24px; }
    .num { font-size: 24px; font-weight: 600; margin: 8px 0 24px; }
    a.btn { display: inline-block; padding: 14px 28px; border-radius: 10px; background: #1e8a4c;
            color: #fff; text-decoration: none; font-weight: 600; font-size: 17px; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="box">
    <div>📞 TaxiLine</div>
    <div class="num" id="num"></div>
    <a class="btn" id="call" href="#">Qo'ng'iroq qilish</a>
  </div>
  <script>
    (function () {
      var raw = new URLSearchParams(location.search).get('n') || '';
      var digits = raw.replace(/\D/g, '');
      if (digits.length === 9) digits = '998' + digits;
      var num = document.getElementById('num');
      var btn = document.getElementById('call');
      if (!/^998\d{9}$/.test(digits)) {
        num.textContent = "Raqam noto'g'ri";
        num.className = 'num err';
        btn.style.display = 'none';
        return;
      }
      var d = digits.slice(3);
      num.textContent = '+998 ' + d.slice(0, 2) + ' ' + d.slice(2, 5) + ' ' + d.slice(5, 7) + ' ' + d.slice(7);
      btn.href = 'tel:+' + digits;
      location.href = btn.href;
    })();
  </script>
</body>
</html>
