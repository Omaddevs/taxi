<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1117" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f6f8" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="light dark">
  <title>Qo'ng'iroq — TaxiLine</title>
  <link rel="icon" href="/favicon-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Target of the «📞 Tel qilish» buttons on the bot's group ad cards. Telegram buttons can't
       hold tel: links, so they open this page with a signed ad reference (k, i, s) — plus, for
       login_url buttons, the tapper's Telegram login data. The page posts both to the API, which
       logs the call (admin → Bot sozlamalari → Aloqa) and returns the number to dial. -->
  <style>
    :root {
      --brand: #00c7d4; --brand-hi: #2fe0ea; --brand-lo: #00a3ae; --on-brand: #022a2f;
      --bg: #f2f6f8; --glow: rgba(0, 199, 212, 0.16);
      --surface: #ffffff; --surface-2: #f3f7f9; --line: #e2e9ee; --line-2: #d3dde4;
      --ink: #0e1c25; --muted: #627584; --faint: #93a3af;
      --danger: #e5484d; --live: #12b76a;
      --shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 24px 60px -24px rgba(14, 40, 56, 0.22), 0 2px 6px rgba(14, 40, 56, 0.04);
      --dots: rgba(14, 28, 37, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1117; --glow: rgba(0, 199, 212, 0.20);
        --surface: #111a21; --surface-2: #17232c; --line: rgba(255, 255, 255, 0.07); --line-2: rgba(255, 255, 255, 0.11);
        --ink: #edf4f7; --muted: #8b9ba7; --faint: #5f707c;
        --shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 30px 70px -30px rgba(0, 0, 0, 0.7);
        --dots: rgba(255, 255, 255, 0.05);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent; overflow-x: hidden; position: relative;
    }
    /* Backdrop: a soft brand glow from the top and a faint dot grid that fades out. */
    body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    body::before { background: radial-gradient(120% 60% at 50% -8%, var(--glow), transparent 62%); }
    body::after {
      background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(90% 55% at 50% 0%, #000 20%, transparent 75%);
      mask-image: radial-gradient(90% 55% at 50% 0%, #000 20%, transparent 75%);
    }
    header, main, footer { position: relative; z-index: 1; }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 20px 6px; padding-top: max(18px, env(safe-area-inset-top));
    }
    header a { display: inline-flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
    header img { width: 32px; height: 32px; border-radius: 9px; }
    header b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    header b span { color: var(--brand); }

    main {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 12px 16px 20px; gap: 14px;
    }
    .card {
      width: 100%; max-width: 392px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 28px; padding: 34px 20px 20px; box-shadow: var(--shadow); text-align: center;
    }

    /* ── Contact ─────────────────────────────────────────── */
    .avatar-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 26px; }
    .ring {
      position: absolute; inset: 0; border-radius: 50%; padding: 2px;
      background: conic-gradient(from 210deg, var(--brand-hi), var(--brand-lo) 40%, rgba(0, 199, 212, 0.12) 62%, var(--brand-hi));
    }
    .avatar {
      width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center;
      background: radial-gradient(circle at 30% 25%, var(--surface-2), var(--surface) 75%);
      color: var(--brand); font-size: 32px; font-weight: 700; letter-spacing: -0.02em;
      box-shadow: 0 0 0 4px var(--surface) inset;
    }
    .avatar svg { width: 34px; height: 34px; }
    .pulse {
      position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--brand);
      opacity: 0; pointer-events: none;
    }
    .calling .pulse { animation: pulse 2.4s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
    .calling .pulse + .pulse { animation-delay: 1.2s; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.55); opacity: 0; } }

    .role {
      position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
      height: 26px; padding: 0 10px 0 8px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line-2);
      font-size: 12px; font-weight: 600; color: var(--ink);
      box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.18);
    }
    .role svg { width: 14px; height: 14px; color: var(--brand); }

    .name { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; margin: 0; }
    .group {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      font-size: 13px; color: var(--muted); margin: 6px 0 0;
    }
    .group svg { width: 14px; height: 14px; flex: none; color: var(--faint); }
    .group span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Number ──────────────────────────────────────────── */
    .number {
      display: flex; align-items: center; gap: 12px; margin: 24px 0 14px; padding: 14px 10px 14px 18px;
      border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); text-align: left;
    }
    .number-body { flex: 1; min-width: 0; }
    .label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
    .phone {
      display: block; margin-top: 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .phone .cc { color: var(--muted); font-weight: 500; }
    .icon-btn {
      flex: none; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); cursor: pointer;
      transition: transform 0.12s ease, color 0.2s ease, border-color 0.2s ease;
    }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn svg { width: 19px; height: 19px; }
    .icon-btn .ok { display: none; }
    .icon-btn.done { color: var(--brand); border-color: var(--brand); }
    .icon-btn.done .ok { display: block; }
    .icon-btn.done .cp { display: none; }

    /* ── Actions ─────────────────────────────────────────── */
    .call {
      position: relative; overflow: hidden; isolation: isolate;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      height: 58px; border-radius: 18px; text-decoration: none;
      background: linear-gradient(180deg, var(--brand-hi), var(--brand) 55%, var(--brand-lo));
      color: var(--on-brand); font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.45) inset, 0 -1px 0 rgba(0, 0, 0, 0.08) inset,
        0 14px 30px -12px rgba(0, 199, 212, 0.75);
      transition: transform 0.12s ease, filter 0.2s ease;
    }
    .call:active { transform: scale(0.985); filter: brightness(0.96); }
    .call::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.45) 50%, transparent 65%);
      transform: translateX(-120%); animation: sheen 3.6s ease-in-out 1.2s infinite;
    }
    @keyframes sheen { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
    .call-icon {
      width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(2, 42, 47, 0.12);
    }
    .call-icon svg { width: 17px; height: 17px; }

    .status {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 14px 0 0; min-height: 18px; font-size: 13px; color: var(--muted);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; animation: blink 1.4s ease-in-out infinite; }
    .calling .dot { background: var(--live); box-shadow: 0 0 0 3px rgba(18, 183, 106, 0.18); animation: none; }
    .failed .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(229, 72, 77, 0.16); animation: none; }
    @keyframes blink { 50% { opacity: 0.35; } }

    .back {
      display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
      background: transparent; border: 0; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
    }
    .back svg { width: 16px; height: 16px; }
    .back:active { background: var(--line); }

    /* ── States ──────────────────────────────────────────── */
    .skeleton {
      display: inline-block; height: 0.9em; width: 62%; border-radius: 8px; vertical-align: middle;
      background: linear-gradient(90deg, var(--line) 25%, var(--line-2) 50%, var(--line) 75%);
      background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .failed .ring { background: conic-gradient(var(--danger), rgba(229, 72, 77, 0.15), var(--danger)); }
    .failed .avatar { color: var(--danger); }
    .failed .number { display: none; }

    .toast {
      position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 5;
      display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 14px;
      background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.45);
      opacity: 0; transform: translate(-50%, 12px); transition: opacity 0.2s ease, transform 0.25s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast svg { width: 16px; height: 16px; color: var(--brand); }

    .rise { animation: rise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

    footer {
      text-align: center; font-size: 12px; color: var(--faint);
      padding: 0 16px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    footer a { color: var(--muted); text-decoration: none; font-weight: 600; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    @media (max-width: 350px) { .phone { font-size: 21px; } .card { padding-left: 16px; padding-right: 16px; } }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/logo.png" alt=""><b>Taxi<span>Line</span></b></a>
  </header>
  <main>
    <section class="card rise" id="card">
      <div class="avatar-wrap">
        <span class="pulse"></span><span class="pulse"></span>
        <div class="ring"><div class="avatar" id="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
        </div></div>
        <span class="role" id="role" hidden></span>
      </div>
      <h1 class="name" id="name"><span class="skeleton"></span></h1>
      <p class="group" id="group" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span id="groupText"></span>
      </p>

      <div class="number">
        <div class="number-body">
          <span class="label">Telefon raqami</span>
          <span class="phone" id="phone"><span class="skeleton" style="width: 85%"></span></span>
        </div>
        <button class="icon-btn" id="copy" type="button" aria-label="Raqamni nusxalash" hidden>
          <svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg>
          <svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </button>
      </div>

      <a class="call" id="call" href="#" hidden>
        <span class="call-icon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg></span>
        Qo'ng'iroq qilish
      </a>
      <p class="status"><span class="dot"></span><span id="hint">Raqam yuklanmoqda…</span></p>
    </section>

    <button class="back" id="back" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Orqaga
    </button>
  </main>
  <footer><a href="/">taxiline.uz</a> · shaharlararo taksi xizmati</footer>
  <div class="toast" id="toast" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    Raqam nusxalandi
  </div>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);
      var host = location.hostname.replace(/^www\./, '');
      var api = /^(localhost|127\.)/.test(host) ? 'http://localhost:4000' : 'https://api.' + host;

      var ICONS = {
        DRIVER: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-4.5l-1.8-4.7A2 2 0 0 0 15.3 6.5H8.7a2 2 0 0 0-1.9 1.3L5 12.5Z"/><path d="M5 12.5h14"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>',
        PASSENGER: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
        ALERT: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
      };

      function initials(name) {
        var parts = (name || '').trim().split(/\s+/).filter(Boolean);
        return parts.length ? (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase() : '';
      }

      function fail(message) {
        $('card').classList.add('failed');
        $('avatar').innerHTML = ICONS.ALERT;
        $('name').textContent = 'Raqamni ochib bo‘lmadi';
        $('hint').textContent = message;
        $('copy').hidden = true;
      }

      function showToast() {
        var t = $('toast');
        t.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
      }

      function show(data) {
        var digits = String(data.phone || '').replace(/\D/g, '');
        if (!/^998\d{9}$/.test(digits)) return fail('Raqam noto‘g‘ri');
        var tel = 'tel:+' + digits;
        var display = data.phoneDisplay || '+998 ' + digits.slice(3, 5) + ' ' + digits.slice(5, 8) + ' ' + digits.slice(8, 10) + ' ' + digits.slice(10);

        var mark = initials(data.ownerName);
        if (mark) $('avatar').textContent = mark;
        $('name').textContent = data.ownerName || 'E’lon egasi';
        if (data.chatTitle) {
          $('groupText').textContent = data.chatTitle;
          $('group').hidden = false;
        }
        if (data.role) {
          var passenger = data.role === 'PASSENGER';
          $('role').innerHTML = passenger ? ICONS.PASSENGER : ICONS.DRIVER;
          $('role').appendChild(document.createTextNode(passenger ? 'Yo‘lovchi' : 'Haydovchi'));
          $('role').hidden = false;
        }

        // Dim the country code so the part people actually read stands out.
        var phone = $('phone');
        phone.textContent = '';
        var m = /^(\+998)\s*(.*)$/.exec(display);
        if (m) {
          var cc = document.createElement('span');
          cc.className = 'cc';
          cc.textContent = m[1] + ' ';
          phone.appendChild(cc);
          phone.appendChild(document.createTextNode(m[2]));
        } else {
          phone.textContent = display;
        }

        $('hint').textContent = 'Qo‘ng‘iroq oynasi ochilmasa, tugmani bosing';
        $('call').href = tel;
        $('call').hidden = false;
        $('copy').hidden = false;
        $('copy').onclick = function () {
          var done = function () {
            $('copy').classList.add('done');
            showToast();
            setTimeout(function () { $('copy').classList.remove('done'); }, 1800);
          };
          if (navigator.clipboard) navigator.clipboard.writeText('+' + digits).then(done, done);
          else done();
        };
        $('card').classList.add('calling');
        // The Telegram login fields shouldn't linger in a URL someone might share.
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        location.href = tel;
      }

      $('back').onclick = function () {
        if (history.length > 1) history.back();
        else window.close();
      };

      // Old cards (before call logging) carry the number itself: ?n=+998… — still logged; if
      // the API can't place it, the number is dialled anyway.
      var legacy = params.get('n');
      var k = params.get('k'), i = params.get('i'), s = params.get('s');
      if (!legacy && (!k || !i || !s)) return fail('Havola to‘liq emas');

      var tg = null;
      if (params.get('hash') && params.get('id')) {
        tg = {};
        params.forEach(function (value, key) { if (key !== 'k' && key !== 'i' && key !== 's' && key !== 'n') tg[key] = value; });
      }

      fetch(api + '/calls', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(legacy ? { n: legacy, tg: tg } : { k: k, i: Number(i), s: s, tg: tg }),
      })
        .then(function (res) {
          return res.json().then(function (body) {
            if (!res.ok) throw new Error((body && body.error && (body.error.message || body.error)) || 'E’lon topilmadi');
            return body;
          });
        })
        .then(show)
        .catch(function (err) {
          if (legacy) return show({ phone: legacy });
          fail(err && err.message ? err.message : 'Internet aloqasini tekshiring');
        });
    })();
  </script>
</body>
</html>
